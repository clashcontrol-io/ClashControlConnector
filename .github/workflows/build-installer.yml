name: Build installer

# Builds ClashControlConnectorInstaller.exe on a stock Windows runner
# without needing any Revit installs. The per-version csproj files use
# Nice3point's stub Revit API NuGet packages when UseStubRevitApi=true,
# so a clean GitHub-hosted Windows runner can build every supported
# Revit year and bundle them into the single-file installer.
#
# Triggers:
#   - workflow_dispatch  -> manual run, exe attached as workflow artifact
#                           (and to the release if dispatched on a v* tag)
#   - push of a v* tag   -> attaches the exe to a GitHub Release
#   - workflow_call      -> invoked by auto-release.yml in the SAME run right
#                           after it creates the tag. Running in-process is what
#                           sidesteps GitHub's rule that a tag created with the
#                           default GITHUB_TOKEN can't trigger another workflow.
#
# Per-version build steps tolerate failures via continue-on-error so the
# workflow still ships an installer even if (for example) the Nice3point
# stub package for the very newest Revit year hasn't been published yet.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      release_tag:
        description: 'Tag to attach the installer to (e.g. v0.1.6). Empty = artifact only.'
        required: false
        type: string
        default: ''

permissions:
  contents: write   # needed to upload the .exe to a GitHub Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # ---- Build each per-version project against stub Revit APIs ----

      - name: Build Revit 2024
        id: build_2024
        continue-on-error: true
        run: >-
          dotnet build versions/2024/ClashControlConnector.2024.csproj
          -c Release
          -p:UseStubRevitApi=true
          -o dist/build/2024

      - name: Build Revit 2025
        id: build_2025
        continue-on-error: true
        run: >-
          dotnet build versions/2025/ClashControlConnector.2025.csproj
          -c Release
          -p:UseStubRevitApi=true
          -o dist/build/2025

      - name: Build Revit 2026
        id: build_2026
        continue-on-error: true
        run: >-
          dotnet build versions/2026/ClashControlConnector.2026.csproj
          -c Release
          -p:UseStubRevitApi=true
          -o dist/build/2026

      - name: Build Revit 2027
        id: build_2027
        continue-on-error: true
        run: >-
          dotnet build versions/2027/ClashControlConnector.2027.csproj
          -c Release
          -p:UseStubRevitApi=true
          -o dist/build/2027

      # ---- Stage successful builds into installer/Resources ----

      - name: Stage installer resources
        shell: pwsh
        run: |
          $years = '2024','2025','2026','2027'
          $bundled = @()
          foreach ($year in $years) {
              $src = "dist/build/$year"
              if (Test-Path "$src/ClashControlConnector.dll") {
                  $dst = "installer/Resources/$year"
                  New-Item -ItemType Directory -Force -Path $dst | Out-Null
                  Copy-Item "$src/ClashControlConnector.dll"   "$dst/" -Force
                  Copy-Item "$src/ClashControlConnector.addin" "$dst/" -Force
                  Copy-Item "$src/Newtonsoft.Json.dll"         "$dst/" -Force
                  Write-Host "Bundled Revit $year"
                  $bundled += $year
              } else {
                  Write-Host "Skipping Revit $year (build did not produce a DLL)"
              }
          }
          if ($bundled.Count -eq 0) {
              Write-Error "No Revit version built successfully — cannot produce an installer."
              exit 1
          }
          "BUNDLED_VERSIONS=$($bundled -join ', ')" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ---- Compile the single-file installer exe ----

      - name: Build installer exe
        run: >-
          dotnet build installer/ClashControlInstaller.csproj
          -c Release
          -o dist/installer

      - name: Show bundled versions
        shell: pwsh
        run: |
          Write-Host "Installer bundles: $env:BUNDLED_VERSIONS"
          Get-Item dist/installer/ClashControlConnectorInstaller.exe |
              Select-Object Name, Length, LastWriteTime

      # ---- Publish artifacts ----

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClashControlConnectorInstaller
          path: dist/installer/ClashControlConnectorInstaller.exe
          if-no-files-found: error

      # Effective release tag: the workflow_call input wins; otherwise, when this
      # run was triggered by (or dispatched on) a v* tag, use that tag. Empty means
      # "no release to attach to" — the artifact upload above is the only output.
      - name: Resolve release tag
        id: rel
        shell: bash
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then
            echo "Attaching installer to release $TAG"
          else
            echo "No release tag — installer available as a workflow artifact only"
          fi

      - name: Attach installer to GitHub Release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          # No body/name here on purpose: the release already exists (auto-release
          # created it with generated notes), and omitting these preserves them —
          # we only add the .exe asset.
          files: dist/installer/ClashControlConnectorInstaller.exe
