name: Auto-release

# On every push to main, read the version from src/App.cs.
# If a tag for that version doesn't exist yet, create it and then build the
# installer IN THE SAME RUN by calling build-installer.yml as a reusable
# workflow. We can't rely on the tag push to trigger build-installer on its
# own: this tag is created with the default GITHUB_TOKEN, and GitHub blocks
# token-created events from triggering further workflow runs (which is why
# earlier bot-cut releases shipped without an installer until someone ran the
# build by hand). Calling it directly runs the build inside this same run, so
# the limitation never applies.

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # Release gate (added after v0.1.8 shipped with the "null"-origin
  # WebSocket vulnerability still present — c4f60ec fixed the source on
  # main, but this workflow's tag-exists check skipped re-releasing until
  # App.Version was bumped past 0.1.8). Grep-based on purpose: simple and
  # self-evidently correct beats a clever check nobody can audit at a
  # glance. If this ever needs to check more than one known-bad pattern,
  # extend the grep rather than reaching for something fancier.
  security-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to release if the WebSocket origin allow-list still permits "null"
        run: |
          FILE=src/Core/WebSocketServer.cs
          BLOCK=$(awk '/AllowedOrigins = new HashSet<string>/,/^        \};/' "$FILE")
          if [ -z "$BLOCK" ]; then
            echo "::error::Could not locate the AllowedOrigins block in $FILE — refusing to release rather than assume it's safe."
            exit 1
          fi
          # -i: the HashSet itself is built with StringComparer.OrdinalIgnoreCase,
          # so "NULL"/"Null"/etc. are equally exploitable at runtime even though
          # this literal grep is on the source text, not the comparer.
          if echo "$BLOCK" | grep -qiE '"null"|"\*"|localhost|127\.0\.0\.1|\[::1\]'; then
            echo "::error::$FILE's AllowedOrigins permits \"null\", a wildcard, or a localhost/dev origin. Only the ClashControl app origins belong in this block (dev origins go in CLASHCONTROL_ALLOWED_ORIGINS) — refusing to release."
            exit 1
          fi
          echo "Origin allow-list guard passed: only the app origins are present in AllowedOrigins."

      # Behavioural check, not just a grep: compile the real WebSocketServer.cs
      # and drive it over real sockets (origin allow-list, DNS-rebinding Host,
      # Private Network Access preflight, pairing token before any WebSocket
      # upgrade). No Revit needed.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: WebSocket access-control tests
        run: dotnet run --project tests/WsSecurity -c Release

  tag-and-release:
    needs: security-guard
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.tag_check.outputs.exists == 'false' }}
      tag: ${{ steps.ver.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history to check existing tags

      - name: Read version from App.cs
        id: ver
        run: |
          VERSION=$(grep -oP 'public const string Version = "\K[^"]+' src/App.cs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.ver.outputs.version }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.ver.outputs.version }} already exists — skipping release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.ver.outputs.version }} is new — will create release."
          fi

      - name: Create tag and GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ClashControl Connector ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          body: |
            ## ClashControl Connector ${{ steps.ver.outputs.tag }}

            **Source commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) — the installer built below (and the security guard above) both run against exactly this commit, so any built installer can be traced back to the source it came from.

            Single-file installer for Revit 2024 / 2025 / 2026 / 2027.

            **Installation:** Download `ClashControlConnectorInstaller.exe` below,
            run it, tick the Revit version(s) you use, click Install.

            > The installer is built and attached automatically by the **Build
            > installer** job in this same release run (Windows, ~3 minutes). If the
            > asset isn't here yet, the build is still running — check the
            > [Actions tab](../../actions/workflows/auto-release.yml).

  # Build the installer in the SAME run and attach it to the release just
  # created. Only runs when a new tag was actually created above.
  build-installer:
    needs: tag-and-release
    if: needs.tag-and-release.outputs.created == 'true'
    uses: ./.github/workflows/build-installer.yml
    permissions:
      contents: write
    with:
      release_tag: ${{ needs.tag-and-release.outputs.tag }}
